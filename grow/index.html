<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grow</title>
<link rel="preload" href="ds/fonts/hanken-grotesk-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="ds/fonts/newsreader-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/motion.css">
<link rel="stylesheet" href="ds/components.css">
<link rel="stylesheet" href="grow.css">
</head>
<body class="ds">
<main class="gr">
  <header class="gr-head">
    <h1 class="ds-display gr-word">Grow</h1>
    <div class="gr-chips">
      <a class="ds-chip" href="scene.html" id="linkScene">Scene</a>
      <span class="ds-chip" id="chipKey">E aeolian</span>
      <span class="ds-chip" id="chipYours" title="Roles using your own sounds">0 of 4 yours</span>
    </div>
  </header>

  <div class="gr-left">
  <section class="gr-stage ds-card" id="stage" aria-label="Piece">
    <canvas id="pic" aria-label="Timeline of the piece with refrains"></canvas>
    <div class="gr-stage__top">
      <div class="gr-clock"><span class="ds-number gr-time" id="time">0:00</span><span class="ds-meta" id="timeTotal">of 10:00</span></div>
      <div class="ds-meta gr-next" id="next">Next refrain 1:24</div>
    </div>
  </section>

  <section class="gr-transport">
    <button type="button" class="ds-btn ds-btn--primary gr-play" id="play" aria-label="Play">
      <svg class="ds-icon" aria-hidden="true"><use href="ds/icons/sprite.svg#i-play"></use></svg><span id="playWord">Play</span>
    </button>
    <button type="button" class="ds-btn ds-btn--raised" id="reseed" title="New seed, same settings">
      <svg class="ds-icon" aria-hidden="true"><use href="ds/icons/sprite.svg#i-sync"></use></svg><span>Reseed</span>
    </button>
  </section>

  <section class="gr-world">
    <div class="ds-seg" role="radiogroup" aria-label="World" id="worldSeg">
      <button type="button" class="ds-seg__opt" role="radio" aria-checked="true" data-value="Folding City">Folding City</button>
      <button type="button" class="ds-seg__opt" role="radio" aria-checked="false" data-value="Quiet Shore">Quiet Shore</button>
      <button type="button" class="ds-seg__opt" role="radio" aria-checked="false" data-value="Desert Dusk">Desert Dusk</button>
    </div>
  </section>
  </div>

  <div class="gr-cols">
  <section class="gr-sec">
    <div class="ds-section-head"><h2 class="ds-section-head__title">Settings</h2></div>
    <div class="ds-card gr-card">
      <div class="gr-pair">
        <label class="gr-field"><span class="ds-label">Key</span>
          <span class="ds-select"><select id="key" aria-label="Key"></select></span></label>
        <label class="gr-field"><span class="ds-label">Mode</span>
          <span class="ds-select"><select id="mode" aria-label="Mode"></select></span></label>
      </div>
      <div id="sliders"></div>
      <div class="gr-field">
        <span class="ds-label">Length</span>
        <div class="ds-seg" role="radiogroup" aria-label="Length" id="lenSeg">
          <button type="button" class="ds-seg__opt" role="radio" aria-checked="true" data-value="600">10 min</button>
          <button type="button" class="ds-seg__opt" role="radio" aria-checked="false" data-value="3600">60 min</button>
        </div>
      </div>
    </div>
  </section>

  <section class="gr-sec">
    <div class="ds-section-head"><h2 class="ds-section-head__title">Sounds</h2><span class="ds-meta" id="yoursLine">0 of 4 yours</span></div>
    <div class="ds-seg gr-kit" role="radiogroup" aria-label="Starter kit" id="kitSeg">
      <button type="button" class="ds-seg__opt" role="radio" aria-checked="true" data-value="made" title="Rebuilt from real horn, cello, synth and texture samples">Real</button>
      <button type="button" class="ds-seg__opt" role="radio" aria-checked="false" data-value="ai" title="The first starter kit">Original</button>
    </div>
    <div class="ds-meta gr-note" id="note" role="status" aria-live="polite"></div>
    <div class="ds-card gr-card" id="roles"></div>
  </section>

  <section class="gr-sec">
    <div class="ds-section-head"><h2 class="ds-section-head__title">Pieces</h2></div>
    <div class="ds-card gr-card">
      <div class="gr-save">
        <input class="ds-input" id="saveName" type="text" placeholder="Name" aria-label="Name" maxlength="40">
        <button type="button" class="ds-btn ds-btn--raised" id="save">Save</button>
      </div>
      <div id="saved" class="gr-saved"></div>
      <div class="gr-export">
        <button type="button" class="ds-btn" id="export" title="Renders 10 minutes at 48 kHz, 16-bit stereo">Export WAV</button>
        <span class="ds-meter gr-meter" id="expMeter" data-value="0" data-label=" " hidden></span>
        <span class="ds-meta" id="expInfo">10 min</span>
      </div>
    </div>
  </section>
  </div>
</main>
<script src="ds/components.js"></script>
<script type="module" src="ui.js"></script>
</body>
</html>
