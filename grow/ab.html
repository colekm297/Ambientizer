<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grow A/B</title>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/components.css">
<link rel="stylesheet" href="grow.css">
<style>
  .ab { max-width: 720px; margin: 0 auto; padding: 16px; }
  .ab-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .ab-inst { margin: 20px 0 8px; }
  .ab-row { display: grid; grid-template-columns: 72px 1fr 1fr 1fr; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--ds-line, #e5e0d6); }
  .ab-row button { min-height: 44px; }
  .ab-row button.on { outline: 2px solid currentColor; }
  .ab-note { font-variant-numeric: tabular-nums; }
  .ab-pick { display: flex; gap: 4px; }
  .ab-empty { opacity: .6; padding: 12px 0; }
</style>
</head>
<body class="ds">
<main class="ab">
  <header class="ab-head">
    <h1 class="ds-display">A/B</h1>
    <a class="ds-chip" href="index.html">Grow</a>
  </header>
  <p>Four instruments. Original plays the starter sound, Made plays the version rebuilt from real instruments, each through its notes low to high. Pick the one you want.</p>
  <div id="list"></div>
</main>
<script type="module">
const A = 'sounds/folding-city/', B = 'sounds/folding-city-made/';
const KEY = 'grow.ab.picks';
let picks = {};
try { picks = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch {} };
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const cache = new Map();
let playing = null, onBtn = null;
async function buf(url) {
  if (!cache.has(url)) cache.set(url, fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then((b) => ctx.decodeAudioData(b)));
  return cache.get(url);
}
let seq = [];
function stop() { seq.forEach((n) => { try { n.stop(); } catch {} }); seq = []; if (playing) { try { playing.stop(); } catch {} playing = null; } if (onBtn) { onBtn.classList.remove('on'); onBtn = null; } }
async function play(urls, btn, each) {
  const same = onBtn === btn; stop(); if (same) return;
  await ctx.resume();
  try {
    const bufs = await Promise.all(urls.map(buf));
    let t = ctx.currentTime + 0.05;
    bufs.forEach((b, i) => {
      const d = Math.min(each, b.duration), s = ctx.createBufferSource(), g = ctx.createGain();
      s.buffer = b; s.connect(g).connect(ctx.destination);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 0.03);
      g.gain.setValueAtTime(1, t + d - 0.4); g.gain.linearRampToValueAtTime(0, t + d);
      s.start(t); s.stop(t + d + 0.05); seq.push(s);
      if (i === bufs.length - 1) s.onended = () => { if (onBtn === btn) stop(); };
      t += d - 0.3;
    });
    onBtn = btn; btn.classList.add('on');
  } catch { btn.textContent = 'Missing'; btn.disabled = true; }
}
const name = (z) => z.file.replace(/\.wav$/, '.flac');
async function main() {
  const list = document.getElementById('list');
  const meta = await (await fetch(A + 'samples.json')).json();
  let made = null;
  try { const r = await fetch(B + 'samples.json'); if (r.ok) made = await r.json(); } catch {}
  if (!made) { list.innerHTML = '<p class="ab-empty">The recreations are not in yet.</p>'; }
  for (const inst of meta.instruments) {
    const zones = [...(inst.zones || [])].sort((a, b) => (a.root || 0) - (b.root || 0));
    const files = zones.map((z) => encodeURIComponent(name(z)));
    const id = inst.id;
    const each = (id === 'pad' || id === 'texture') ? 5 : 2.6;
    const row = document.createElement('div'); row.className = 'ab-row';
    row.innerHTML = `<span class="ab-note">${inst.name}</span>
      <button class="ds-btn" data-k="a">Original</button>
      <button class="ds-btn" data-k="b" ${made ? '' : 'disabled'}>Made</button>
      <span class="ab-pick"><button class="ds-btn" data-p="a">A</button><button class="ds-btn" data-p="b" ${made ? '' : 'disabled'}>B</button></span>`;
    row.querySelector('[data-k=a]').onclick = (e) => play(files.map((f) => A + f), e.currentTarget, each);
    row.querySelector('[data-k=b]').onclick = (e) => play(files.map((f) => B + f), e.currentTarget, each);
    const mark = () => row.querySelectorAll('[data-p]').forEach((b) => b.classList.toggle('on', picks[id] === b.dataset.p));
    row.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { picks[id] = b.dataset.p; save(); mark(); });
    mark(); list.appendChild(row);
  }
}
main();
window.ABTest = { picks: () => picks };
</script>
</body>
</html>
