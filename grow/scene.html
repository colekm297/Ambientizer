<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scene</title>
<link rel="preload" href="ds/fonts/hanken-grotesk-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="ds/fonts/newsreader-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/motion.css">
<link rel="stylesheet" href="ds/components.css">
<link rel="stylesheet" href="grow.css">
<link rel="stylesheet" href="scene.css">
</head>
<body class="ds">
<main class="gr sc">
  <header class="gr-head">
    <h1 class="ds-display gr-word">Scene</h1>
    <div class="gr-chips">
      <span class="ds-chip" id="chipWorld">Desert</span>
      <a class="ds-chip" href="index.html" id="linkGrow">Grow</a>
    </div>
  </header>

  <div class="gr-left">
    <section class="sc-stage ds-card" id="stage" aria-label="Scene">
      <canvas id="cv" width="1280" height="720" aria-label="Animated scene"></canvas>
      <canvas id="selcv" class="sc-sel" width="320" height="180" aria-label="Selection"></canvas>
      <div class="sc-stage__top">
        <span class="ds-chip sc-refrain" id="refrain" hidden>Refrain</span>
        <span class="ds-meta sc-next" id="next"></span>
      </div>
    </section>

    <section class="gr-transport sc-transport">
      <button type="button" class="ds-btn ds-btn--primary gr-play" id="play" aria-label="Play">
        <svg class="ds-icon" aria-hidden="true"><use href="ds/icons/sprite.svg#i-play"></use></svg><span id="playWord">Play</span>
      </button>
      <button type="button" class="ds-btn ds-btn--raised sc-select" id="select" aria-pressed="false" title="Brush or lasso a region, then Ask for an element"><span id="selectWord">Select</span></button>
      <button type="button" class="ds-btn ds-btn--raised sc-export" id="export" title="Records 1 minute of picture and sound">Export 1 min</button>
    </section>
    <div class="ds-meta sc-status" id="status" role="status" aria-live="polite"></div>

    <section class="ds-card gr-card sc-ask" id="askCard" hidden aria-label="Ask">
      <div class="ds-section-head"><h2 class="ds-section-head__title" id="askTitle">Select</h2></div>
      <div class="sc-ask__tools" id="askTools">
        <div class="sc-ask__tool"><div id="askToolSlot"></div><button type="button" class="ds-btn ds-btn--ghost" id="askClear">Clear</button></div>
        <div id="askSize"></div>
      </div>
      <div class="sc-ask__row">
        <input class="ds-input" id="askText" type="text" maxlength="300" placeholder="Rock arch" aria-label="Request" enterkeyhint="send" autocomplete="off">
        <button type="button" class="ds-btn ds-btn--primary" id="askGo">Ask</button>
      </div>
      <div class="ds-meta sc-ask__note" id="askNote" role="status" aria-live="polite"></div>
      <div class="sc-vars" id="variants"></div>
    </section>
  </div>

  <div class="gr-cols">
    <section class="gr-sec">
      <div class="ds-section-head"><h2 class="ds-section-head__title">Layers</h2></div>
      <div class="ds-seg sc-layerseg" role="radiogroup" aria-label="Layer" id="layerSeg">
        <button type="button" class="ds-seg__opt" role="radio" aria-checked="true" data-value="sky">Sky</button>
        <button type="button" class="ds-seg__opt" role="radio" aria-checked="false" data-value="suns">Suns</button>
        <button type="button" class="ds-seg__opt" role="radio" aria-checked="false" data-value="far">Far</button>
        <button type="button" class="ds-seg__opt" role="radio" aria-checked="false" data-value="cliff">Cliff</button>
        <button type="button" class="ds-seg__opt" role="radio" aria-checked="false" data-value="near">Near</button>
        <button type="button" class="ds-seg__opt" role="radio" aria-checked="false" data-value="air">Air</button>
      </div>
      <div class="ds-card gr-card sc-panel" id="panel"></div>
    </section>

    <section class="gr-sec" id="elementsSec" hidden>
      <div class="ds-section-head"><h2 class="ds-section-head__title">Elements</h2></div>
      <div class="ds-card gr-card sc-els" id="elements"></div>
    </section>

    <section class="gr-sec">
      <div class="ds-section-head"><h2 class="ds-section-head__title">Scene</h2></div>
      <div class="ds-card gr-card">
        <div id="sliders"></div>
        <div class="gr-save">
          <input class="ds-input" id="seed" type="text" inputmode="numeric" aria-label="Seed" maxlength="10">
          <button type="button" class="ds-btn ds-btn--raised" id="reseed" title="New seed, same settings">
            <svg class="ds-icon" aria-hidden="true"><use href="ds/icons/sprite.svg#i-sync"></use></svg><span>Reseed</span>
          </button>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="ds/components.js"></script>
<script type="module" src="scene.js"></script>
</body>
</html>
